[[mods]]
modId="gas"
version="${mod_version}"
displayName="Golden Apple Set 金苹果套装"
authors="ZCode"
description='''
金苹果套装 Golden Apple Set — Forge 1.20.1 全套装备 mod。
在已上线的「金苹果剑」(gas:golden_apple_sword) 基础上新增 4 件盔甲 / 4 件工具 / 盾 / 弓,共 11 件。
材质 GAS(金苹果):耐久 512 / 挖掘速度 12.0（下界合金为 9.0） / 伤害加成 5.0 / 挖掘等级 2(铁级) / 附魔值 22 / 修复材料金苹果。
全部装备集中在独立的「金苹果套装」创造模式标签页。
盔甲:总防御 20（下界合金级）/ 每件韧性 2、全套 8（钻石级）。
完整四件套:增加 6 点生命上限，持续生命恢复 I。
新增「金苹果农夫」与刷怪蛋：村庄随机刷新，使用绿宝石交易金苹果，每轮 64 次，定时补货。
黄金维度：主世界式自然地形，金苹果草地、金苹果泥土、白色石头与圆石，淡紫色天空。
可选联动精妙背包与精妙核心：金苹果农夫随机佩戴并保存一个背包。
'''

[[dependencies.gas]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.gas]]
